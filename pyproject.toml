[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nrsaa"
version = "0.1.0"
description = "Working prototype for three-lead ECG processing, multilabel classification, and sensor acquisition"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "third_party/*.txt"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.12,<2", "PyWavelets>=1.5,<2",
  "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "matplotlib>=3.8,<4",
]

[project.urls]
Repository = "https://github.com/niki-21/NRSAA"
Documentation = "https://github.com/niki-21/NRSAA#readme"
Issues = "https://github.com/niki-21/NRSAA/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
neural = ["tensorflow>=2.16,<3"]
hardware = ["pyserial>=3.5,<4"]

[project.scripts]
nrsaa = "ecg_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["ecg_monitor"]
